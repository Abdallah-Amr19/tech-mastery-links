<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Links Hub</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome for social icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- =============================================
       ANIMATED BACKGROUND BLOBS
       Decorative gradient shapes in the background
  ============================================= -->
    <div class="bg-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- =============================================
       MAIN CARD CONTAINER
       Centered glass-morphism card
  ============================================= -->
    <main class="hub-card" role="main">
      <!-- ---- HEADER: Logo + Name + Tagline ---- -->
      <header class="hub-header">
        <!-- Company Logo placeholder — replace src with your actual logo -->
        <div class="logo-wrapper">
          <img src="./WhatsApp Image 2026-05-17 at 1.09.58 AM.png" alt="" />
        </div>

        <h1 class="company-name">Tech Mastery</h1>
        <p class="company-tagline">Master Evrey Line.</p>
      </header>

      <!-- ---- SOCIAL MEDIA BUTTONS ---- -->
      <nav class="social-links" aria-label="Social media links">
        <!-- Facebook -->
        <a
          href="https://www.facebook.com/share/1GxpaUyFUd/?mibextid=wwXIfr"
          class="social-btn social-btn--facebook"
          aria-label="Visit us on Facebook"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-btn__icon" aria-hidden="true">
            <i class="fa-brands fa-facebook-f"></i>
          </span>
          <span class="social-btn__name">Facebook</span>
          <span class="social-btn__arrow" aria-hidden="true">
            <i class="fa-solid fa-arrow-right"></i>
          </span>
        </a>

        <!-- LinkedIn -->
        <a
          href="https://www.linkedin.com/company/tech-mastery7/"
          class="social-btn social-btn--linkedin"
          aria-label="Visit us on LinkedIn"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-btn__icon" aria-hidden="true">
            <i class="fa-brands fa-linkedin-in"></i>
          </span>
          <span class="social-btn__name">LinkedIn</span>
          <span class="social-btn__arrow" aria-hidden="true">
            <i class="fa-solid fa-arrow-right"></i>
          </span>
        </a>

        <!-- Instagram -->
        <a
          href="https://www.linkedin.com/company/tech-mastery7/"
          class="social-btn social-btn--instagram"
          aria-label="Visit us on Instagram"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-btn__icon" aria-hidden="true">
            <i class="fa-brands fa-instagram"></i>
          </span>
          <span class="social-btn__name">Instagram</span>
          <span class="social-btn__arrow" aria-hidden="true">
            <i class="fa-solid fa-arrow-right"></i>
          </span>
        </a>
      </nav>

      <!-- ---- FOOTER ---- -->
      <footer class="hub-footer">
        <p class="footer-text">
          <i class="fa-solid fa-signal" aria-hidden="true"></i>
          Connect With Us
        </p>
      </footer>
    </main>

    <script src="main.js"></script>
  </body>
</html>
